[package]
name = "disk-heatmap"
version = "0.2.0"
description = "See what fills your drive and what is safe to clean"
edition = "2021"

[lib]
name = "disk_heatmap_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rayon = "1"
sysinfo = "0.33"
tauri-plugin-updater = "2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_UI_Shell"] }

[profile.dev.package."*"]
# Dependencies optimised even in dev so scans are fast under `tauri dev`.
opt-level = 3

[profile.dev]
opt-level = 1
